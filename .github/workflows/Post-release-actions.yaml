name: Post-release actions

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3)"
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCE_REPO: ${{ github.repository }}

jobs:
  build-metadata:
    name: Download asset and compute sha256
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.tag }}
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - name: Prepare metadata
        id: meta
        run: |
          set -euo pipefail
          echo "tag=${{ inputs.version || github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          echo "asset_name=PhoenixChannelsClient.xcframework.zip" >> "$GITHUB_OUTPUT"

      - name: Download release asset
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag}}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name}}
          SRC_REPO: ${{ env.SOURCE_REPO }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          # Download by exact name or pattern
          gh release download "$TAG" \
            --repo "$SRC_REPO" \
            --pattern "$ASSET_NAME" \
            --dir artifact
          FILE_COUNT=$(find artifact -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [ "$FILE_COUNT" -ne 1 ]; then
            echo "Expected exactly one asset matching '$ASSET_NAME', found $FILE_COUNT" >&2
            ls -l artifact >&2 || true
            exit 1
          fi
          ASSET_PATH=$(find artifact -mindepth 1 -maxdepth 1 -type f)
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"

      - name: Calculate SHA-256 hash
        id: hash
        env:
          FILE: ${{ steps.download.outputs.asset_path }}
        run: |
          set -euo pipefail
          test -f "$FILE"
          SHASUM=$(sha256sum "$FILE" | awk '{print $1}')
          echo "sha256=$SHASUM" >> "$GITHUB_OUTPUT"
          echo "Computed sha256: $SHASUM"

  create-prs:
    name: Create update PRs in target repos
    needs: build-metadata
    runs-on: ubuntu-latest
    # Cross-repo work uses the GitHub App token; GITHUB_TOKEN needs no extra scopes.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: salemove/ios-sdk
            base_branch: development
            updates:
              - file: Dependencies/Package.swift
                version_regex: >
                  (\s*url\s*:\s*".*?/releases/download/)[^/]+(/PhoenixChannelsClient\.xcframework\.zip".*)
                checksum_regex: >
                  (PhoenixChannelsClient\.xcframework\.zip",\s*\n+\s*checksum:\s*")[^"]+("\s*)
              - file: GliaCoreSDK/templates/Package.swift
                version_regex: >
                  (\s*url\s*:\s*".*?/releases/download/)[^/]+(/PhoenixChannelsClient\.xcframework\.zip".*)
                checksum_regex: >
                  (PhoenixChannelsClient\.xcframework\.zip",\s*\n+\s*checksum:\s*")[^"]+("\s*)
            commit_message: "chore: bump PhoenixChannelsClient to ${{ needs.build-metadata.outputs.version }}"
            pr_title: "Bump PhoenixChannelsClient to ${{ needs.build-metadata.outputs.version }}"
            pr_body: |
              Version: ${{ needs.build-metadata.outputs.version }}
              SHA256:  ${{ needs.build-metadata.outputs.sha256 }}
          - repo: salemove/ios-sdk-widgets
            base_branch: development
            updates:
              - file: templates/Package.swift
                version_regex: >
                  (\s*url\s*:\s*".*?/releases/download/)[^/]+(/PhoenixChannelsClient\.xcframework\.zip".*)
                checksum_regex: >
                  (PhoenixChannelsClient\.xcframework\.zip",\s*\n+\s*checksum:\s*")[^"]+("\s*)
              - file: Package.swift
                version_regex: >
                  (\s*url\s*:\s*".*?/releases/download/)[^/]+(/PhoenixChannelsClient\.xcframework\.zip".*)
                checksum_regex: >
                  (PhoenixChannelsClient\.xcframework\.zip",\s*\n+\s*checksum:\s*")[^"]+("\s*)
            commit_message: "chore: bump PhoenixChannelsClient to ${{ needs.build-metadata.outputs.version }}"
            pr_title: "Bump PhoenixChannelsClient to ${{ needs.build-metadata.outputs.version }}"
            pr_body: |
              - version -> ${{ needs.build-metadata.outputs.version }}
              - sha256  -> ${{ needs.build-metadata.outputs.sha256 }}

    steps:
      - name: Parse repo name
        id: parse_repo
        run: |
          REPO_NAME=$(echo "${{ matrix.repo }}" | cut -d'/' -f2)
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.parse_repo.outputs.repo_name }}

      - name: Checkout target repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.base_branch }}
          token: ${{ steps.generate_token.outputs.token }}

      - name: Create update branch
        id: branch
        run: |
          set -euo pipefail
          VERSION='${{ needs.build-metadata.outputs.version }}'
          BRANCH="chore/phoenix-channels-client-${VERSION}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Update version and sha256 in files
        env:
          UPDATES_JSON: ${{ toJson(matrix.updates) }}
          VERSION: ${{ needs.build-metadata.outputs.version }}
          SHA256: ${{ needs.build-metadata.outputs.sha256 }}
        run: |
          set -euo pipefail
          UPDATED=0
          # Process substitution instead of a pipe so UPDATED survives the loop;
          # feed jq from the variable so no scratch file ends up in the consumer repo.
          while read -r item; do
            FILE=$(echo "$item" | jq -r '.file')
            VERSION_REGEX=$(echo "$item" | jq -r '.version_regex')
            CHECKSUM_REGEX=$(echo "$item" | jq -r '.checksum_regex')

            # A file may not exist (yet) in the target repo; skip it rather than
            # failing the whole matrix entry.
            if [ ! -f "$FILE" ]; then
              echo "::warning::File not found, skipping: $FILE"
              continue
            fi

            # perl in slurp mode rather than sed: the checksum pattern spans the
            # newline between the url and checksum lines, which sed cannot match
            # because it processes input one line at a time.
            perl -0777 -i -pe "s|${VERSION_REGEX}|\${1}${VERSION}\${2}|g" "$FILE"

            # Update checksum only if CHECKSUM_REGEX is not empty
            if [ -n "$CHECKSUM_REGEX" ]; then
              perl -0777 -i -pe "s|${CHECKSUM_REGEX}|\${1}${SHA256}\${2}|g" "$FILE"
            fi

            if git diff --quiet -- "$FILE"; then
              echo "::warning::No changes in $FILE (regex did not match or version already current)"
              continue
            fi
            UPDATED=$((UPDATED + 1))
            echo "Updated $FILE"
          done < <(jq -c '.[]' <<< "$UPDATES_JSON")

          if [ "$UPDATED" -eq 0 ]; then
            echo "::error::None of the configured files exist in ${{ matrix.repo }}; nothing to update."
            exit 1
          fi
          git status --porcelain

      - name: Commit changes
        id: commit
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit. Skipping PR."
            echo "skip_pr=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "${{ matrix.commit_message }}"
          # The chore/phoenix-channels-client-<version> branch is owned by this automation, so a stale copy from an earlier run is safe to overwrite.
          # Fetch it first: the shallow checkout has no remote-tracking ref for it, and
          # --force-with-lease rejects the push as "stale info" without one.
          git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" || true
          git push --force-with-lease --set-upstream origin HEAD
          echo "skip_pr=false" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.commit.outputs.skip_pr != 'true'
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          REPO: ${{ matrix.repo }}
          HEAD: ${{ steps.branch.outputs.name }}
          BASE: ${{ matrix.base_branch }}
          TITLE: ${{ matrix.pr_title }}
          BODY: ${{ matrix.pr_body }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --repo "$REPO" --base "$BASE" --head "$HEAD" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing already exists for $HEAD"
            exit 0
          fi
          gh pr create --repo "$REPO" --base "$BASE" --head "$HEAD" --title "$TITLE" --body "$BODY"

      - name: PR URL
        if: steps.commit.outputs.skip_pr != 'true'
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          REPO: ${{ matrix.repo }}
          HEAD: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          gh pr view --repo "$REPO" "$HEAD" --json url --jq .url
